name: Generate Snake Contribution Grid
on:
  # Executa automaticamente a cada 24 horas (à meia-noite UTC)
  schedule:
    - cron: "0 0 * * *"
  
  # Permite rodar o workflow manualmente pela aba Actions
  workflow_dispatch:
  
  # Roda a cada push na branch main/master
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Gera o jogo da cobrinha em SVG baseado nos seus commits
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      # Salva a imagem gerada na branch 'output'
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}