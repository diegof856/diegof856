name: Daily Contribution

on:
  schedule:
    # Executa todos os dias às 12:00 UTC
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update contribution file
        run: |
          echo "Última atualização: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > contribution.txt

      - name: Commit changes
        run: |
          git add contribution.txt

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para realizar."
            exit 0
          fi

          git commit -m "chore: update daily contribution"

      - name: Push changes
        run: |
          git push